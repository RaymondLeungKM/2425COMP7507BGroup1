<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Train body -->
  <rect x="4" y="12" width="24" height="10" rx="2" fill="#1a237e"/>
  
  <!-- Train front -->
  <rect x="2" y="14" width="4" height="6" rx="2" fill="#3949ab"/>
  
  <!-- Windows -->
  <rect x="8" y="15" width="3" height="3" rx="0.5" fill="#e3f2fd"/>
  <rect x="13" y="15" width="3" height="3" rx="0.5" fill="#e3f2fd"/>
  <rect x="18" y="15" width="3" height="3" rx="0.5" fill="#e3f2fd"/>
  <rect x="23" y="15" width="3" height="3" rx="0.5" fill="#e3f2fd"/>
  
  <!-- Wheels -->
  <circle cx="8" cy="24" r="2.5" fill="#424242"/>
  <circle cx="8" cy="24" r="1.5" fill="#757575"/>
  <circle cx="16" cy="24" r="2.5" fill="#424242"/>
  <circle cx="16" cy="24" r="1.5" fill="#757575"/>
  <circle cx="24" cy="24" r="2.5" fill="#424242"/>
  <circle cx="24" cy="24" r="1.5" fill="#757575"/>
  
  <!-- Tracks -->
  <rect x="0" y="26" width="32" height="1" fill="#8d6e63"/>
  <rect x="0" y="28" width="32" height="1" fill="#8d6e63"/>
  
  <!-- Track ties -->
  <rect x="2" y="25" width="1" height="4" fill="#5d4037"/>
  <rect x="6" y="25" width="1" height="4" fill="#5d4037"/>
  <rect x="10" y="25" width="1" height="4" fill="#5d4037"/>
  <rect x="14" y="25" width="1" height="4" fill="#5d4037"/>
  <rect x="18" y="25" width="1" height="4" fill="#5d4037"/>
  <rect x="22" y="25" width="1" height="4" fill="#5d4037"/>
  <rect x="26" y="25" width="1" height="4" fill="#5d4037"/>
  <rect x="30" y="25" width="1" height="4" fill="#5d4037"/>
</svg>
